[project]
name = "chisto-crm"
version = "0.7.2"
description = "CRM «Чистый Липецк»: мастер-данные ДРТ и приём нарушений из Data Gateway"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.36,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "alembic>=1.14,<2",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
