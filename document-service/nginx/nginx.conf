# Обратный прокси для CRM: HTTPS и передача запросов в backend.
#
# Два имени обслуживаются разными сертификатами:
#   * 82.202.140.51 — сертификат Let's Encrypt на IP-адрес (выпускается по
#     протоколу HTTP-01, домен для него не нужен). Он же сервер по умолчанию:
#     браузер, открывая адрес по IP, имени сервера не передаёт.
#   * docs.moneta-rus.pro — сертификат на домен, выпускается, когда домен
#     начнёт указывать на этот сервер. Пока лежит временный самоподписанный.
#
# По HTTP приложение недоступно: только переадресация на HTTPS и проверка
# владения домёном для Let's Encrypt.

upstream document_service_backend {
    server backend:8000;
}

server {
    listen 80;
    listen [::]:80;
    # Адрес интерфейса диспетчера: по нему же выпускается сертификат, поэтому
    # имя должно быть здесь — иначе проверка владения доменом не дойдёт.
    server_name chili.moneta-rus.pro chill.moneta-rus.pro 82.202.140.51;

    # Проверка владения домёном для Let's Encrypt.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # По HTTP приложение недоступно: только переадресация на HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# Основной сервер: доступ по IP-адресу.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 82.202.140.51;

    # Нужно для git по HTTP: в путях бывают закодированные слэши, а nginx
    # по умолчанию схлопывает двойные слэши и ломает такие запросы.
    merge_slashes off;

    ssl_certificate     /etc/letsencrypt/live/82.202.140.51/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/82.202.140.51/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # Git переехал на отдельный порт 8443 (см. блок ниже): старые ссылки
    # вида /git/... переадресуются туда, чтобы закладки не ломались.
    location /git/ {
        rewrite ^/git/(.*)$ https://$host:8443/$1 permanent;
    }

    # Интерфейс диспетчера: отдельная сборка SPA живёт по своему адресу, но
    # на том же домене и порту, что и наше приложение. Так у них общие
    # сертификат, сессия и /api — без CORS и второго входа.
    # Здесь именно root, а не alias: с alias try_files ищет файлы по полному
    # пути с префиксом и на любой запрос отдаёт index.html.
    location /dispatch/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /dispatch/index.html;
    }

    # Шрифт для выгрузки документов на стенде SPA: она просит его по
    # абсолютному пути /fonts/...
    location /fonts/ {
        alias /usr/share/nginx/html/dispatch/fonts/;
    }

    location / {
        proxy_pass http://document_service_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }
}

# Интерфейс диспетчера на своём имени. Тот же сервис, что и по IP, но с
# сертификатом на домен: ключ Яндекс Карт ограничивается домёном (по IP
# кабинет Яндекса ограничивать не умеет), а сертификат на имя привычнее.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chili.moneta-rus.pro chill.moneta-rus.pro;

    ssl_certificate     /etc/letsencrypt/live/chili.moneta-rus.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chili.moneta-rus.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;


    # Свои тайлы карты: локальный слепок Липецка на 3.7 МБ, отдаётся
    # сервером тайлов на хосте. Внешние сервисы карте больше не нужны.
    location /tiles/ {
        proxy_pass http://172.17.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Держим тайлы в кэше браузера недолго: слепок изредка пересобирается,
        # и после этого старые тайлы не должны неделю висеть у пользователей.
        add_header Cache-Control "public, max-age=300" always;
    }

    # Сборка интерфейса диспетчера: та же статика, что и по IP.
    location /dispatch/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /dispatch/index.html;
    }

    location /fonts/ {
        alias /usr/share/nginx/html/dispatch/fonts/;
    }

    location / {
        proxy_pass http://document_service_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }
}

# Доступ по домену: включается, когда домен начнёт указывать на сервер.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name docs.moneta-rus.pro;

    ssl_certificate     /etc/letsencrypt/live/docs.moneta-rus.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.moneta-rus.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        proxy_pass http://document_service_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }
}

# Git-сервер проекта (Forgejo) на своём порту.
#
# Адрес вынесен в переменную с resolver: nginx разбирает имя во время запроса,
# а не при запуске. Иначе выключенный git-контейнер не дал бы подняться nginx,
# и вместе с git-ом упало бы приложение.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name 82.202.140.51;

    # Нужно для git по HTTP: в путях бывают закодированные слэши, а nginx
    # по умолчанию схлопывает двойные слэши и ломает такие запросы.
    merge_slashes off;

    ssl_certificate     /etc/letsencrypt/live/82.202.140.51/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/82.202.140.51/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # Пуш репозитория: тело запроса не режем.
    client_max_body_size 100m;

    location / {
        resolver 127.0.0.11 valid=10s;
        set $forgejo http://forgejo:3000;
        proxy_pass $forgejo$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Connection $http_connection;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
